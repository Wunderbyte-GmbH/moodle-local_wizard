name: Moodle Plugin CI

on: [push, pull_request]

# local_wizard runs standalone: tests that need mod_booking skip themselves when it is not installed.
# The Moodle branches are listed here on purpose. When moodle_branches is set, the shared workflow
# ignores $plugin->supported in version.php, so keep both in line when a new Moodle version comes out.
jobs:
  # Moodle 4.5: no Wunderbyte AI provider (it needs Moodle 5.0+), so the agent tests skip here.
  moodle45:
    uses: Wunderbyte-GmbH/catalyst-moodle-workflows/.github/workflows/ci.yml@main
    with:
      disable_release: true
      moodle_branches: "MOODLE_405_STABLE"
      # The PHPDoc checker does not read thirdpartylibs.xml: the vendored pdfparser library.
      phpdocchecker_ignore_paths: 'thirdparty'
      # The shipped AMD builds are generated from bookingextension_agent by renaming tokens, so their
      # source maps never match a fresh build; the workflow rebuilds them before the grunt check,
      # as the mod_booking workflow does.
      workarounds: |
        # WORKAROUND 17/04/2025: The following code is a workaround for the "File is stale and needs to be rebuilt" error
        # This occurs when AMD modules import Moodle core dependencies
        # See issue: https://github.com/moodlehq/moodle-plugin-ci/issues/350
        # This workaround should be removed once the issue is fixed upstream
        # Load NVM and use the version from .nvmrc
        export NVM_DIR="$HOME/.nvm"
        [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

        # Go to moodle directory
        cd moodle

        # Use NVM to set Node version and ensure grunt-cli is installed
        nvm use
        npm install
        npm install -g grunt-cli

        # Go back to plugin directory
        cd ../plugin

        # Pre-build AMD files to avoid stale file warnings
        echo "=== Building AMD files before CI check ==="
        grunt --gruntfile ../moodle/Gruntfile.js amd
        echo "AMD files built successfully"

        # Go Back to main directory
        cd ..
        # END OF WORKAROUND

  # Moodle 5.0 - 5.3 with the Wunderbyte AI provider, so the agent tests run as well.
  moodle5x:
    uses: Wunderbyte-GmbH/catalyst-moodle-workflows/.github/workflows/ci.yml@main
    with:
      disable_release: true
      moodle_branches: "MOODLE_500_STABLE MOODLE_501_STABLE MOODLE_502_STABLE MOODLE_503_STABLE"
      extra_plugin_runners: |
        moodle-plugin-ci add-plugin --branch main Wunderbyte-GmbH/moodle-aiprovider_wunderbyte
      # The PHPDoc checker does not read thirdpartylibs.xml: the vendored pdfparser library.
      phpdocchecker_ignore_paths: 'thirdparty'
      # The shipped AMD builds are generated from bookingextension_agent by renaming tokens, so their
      # source maps never match a fresh build; the workflow rebuilds them before the grunt check,
      # as the mod_booking workflow does.
      workarounds: |
        # WORKAROUND 17/04/2025: The following code is a workaround for the "File is stale and needs to be rebuilt" error
        # This occurs when AMD modules import Moodle core dependencies
        # See issue: https://github.com/moodlehq/moodle-plugin-ci/issues/350
        # This workaround should be removed once the issue is fixed upstream
        # Load NVM and use the version from .nvmrc
        export NVM_DIR="$HOME/.nvm"
        [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

        # Go to moodle directory
        cd moodle

        # Use NVM to set Node version and ensure grunt-cli is installed
        nvm use
        npm install
        npm install -g grunt-cli

        # Go back to plugin directory
        cd ../plugin

        # Pre-build AMD files to avoid stale file warnings
        echo "=== Building AMD files before CI check ==="
        grunt --gruntfile ../moodle/Gruntfile.js amd
        echo "AMD files built successfully"

        # Go Back to main directory
        cd ..
        # END OF WORKAROUND
